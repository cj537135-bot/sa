{% extends "base.html" %}{% from "_macros.html" import state_select with context %}{% block body %}<div class="card"><h2>🍲 {{ t('list_food') }}</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>{{ t('f_details') }}</label><input name="description" required placeholder="e.g. Veg thali, dal-rice, fresh today">
<label>Quantity</label><input name="quantity" placeholder="e.g. 20 meals">
<label>{{ t('f_city') }}</label><input name="city" value="{{ user.city }}"><label>{{ t('f_state') }}</label>{{ state_select(user.state or '', all=False) }}
<label>Pickup address (shown only to whoever claims it)</label><input name="pickup_address">
<label>Pickup by (time)</label><input name="pickup_by" placeholder="e.g. 10:30 PM today">
<button class="btn">{{ t('list_food') }}</button></form></div>{% endblock %}

{% extends "base.html" %}{% from "_macros.html" import icon, tile, state_select with context %}{% block body %}
<div class="card"><h2>{{ t('nav_register') }}</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<select name="role" id="role" onchange="tg()">
<option value="beneficiary" {{ 'selected' if request.args.get('role')=='beneficiary' }}>{{ t('need_help') }}</option>
{% for k,v in PROVIDER_ROLES.items() %}<option value="{{k}}">{{v}}</option>{% endfor %}</select>
<label>{{ t('f_username') }}</label><input name="username" required minlength="3">
<label>{{ t('f_password') }} (8+)</label><input type="password" name="password" required minlength="8">
<label>{{ t('f_alias') }}</label><input name="display_name">
<label>{{ t('f_city') }}</label><input name="city"><label>{{ t('f_state') }}</label>{{ state_select(all=False) }}
<div id="prov" style="display:none"><label>Organisation</label><input name="org">
<label>Email</label><input type="email" name="email"><label>{{ t('f_phone') }}</label><input name="phone">
<p class="muted">Providers are verified by an admin before they can respond.</p></div>
<button class="btn">{{ t('nav_register') }}</button></form></div>
<script>function tg(){document.getElementById('prov').style.display=document.getElementById('role').value==='beneficiary'?'none':'block'}tg()</script>{% endblock %}

{% extends "base.html" %}{% from "_macros.html" import icon, tile, state_select with context %}{% block body %}<div class="card"><h2>{{ t('post_job') }}</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>{{ t('f_title') }}</label><input name="title" required placeholder="e.g. Papad making (work from home)">
<label>{{ t('f_details') }}</label><textarea name="description"></textarea>
<label>{{ t('f_city') }}</label><input name="city" value="{{ user.city }}"><label>{{ t('f_state') }}</label>{{ state_select(user.state or '', all=False) }}
<label>Type</label><select name="job_type"><option>Work from home</option><option>Part-time</option><option>Full-time</option><option>Training + job</option></select>
<label>Pay (₹ per month / piece)</label><input name="pay"><label>{{ t('f_phone') }}</label><input name="phone" value="{{ user.phone }}">
<button class="btn">{{ t('post_job') }}</button></form></div>{% endblock %}

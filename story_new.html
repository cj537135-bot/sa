{% extends "base.html" %}{% block body %}<div class="story-editor"><div class="story-editor-head"><div class="section-kicker">{{t('share_story_kicker2')}}</div><h1>{{t('share_story_title2')}}</h1><p>{{t('share_story_sub2')}}</p></div><div class="card story-form-card"><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>{{t('story_title_label2')}}</label><input name="title" maxlength="160" required placeholder="{{t('story_title_placeholder2')}}"><label>{{t('story_category2')}}</label><select name="category">{% for k in CATEGORIES %}<option value="{{k}}">{{t('c_'+k)}}</option>{% endfor %}</select><label>{{t('story_request2')}}</label><select name="request_id" id="request_id"><option value="">{{t('story_no_request2')}}</option>{% for r in closed %}<option value="{{r.id}}" data-duration="{{r.created}}|{{r.closed_at}}">{{r.title}} — {{t('c_'+r.category)}}</option>{% endfor %}</select><div class="duration-preview" id="durationPreview">⏱ {{t('duration_auto2')}}</div><label>{{t('story_body2')}}</label><textarea name="body" rows="8" maxlength="8000" required placeholder="{{t('story_body_placeholder2')}}"></textarea><label>{{t('what_helped2')}}</label><textarea name="what_helped" rows="4" maxlength="3000" placeholder="{{t('what_helped_placeholder2')}}"></textarea><label>{{t('outcome2')}}</label><textarea name="outcome" rows="4" maxlength="3000" placeholder="{{t('outcome_placeholder2')}}"></textarea><div class="story-privacy">🔒 {{t('story_privacy2')}}</div><button class="btn">{{t('publish_story2')}}</button></form></div></div><script>const sel=document.getElementById('request_id'),p=document.getElementById('durationPreview');function duration(){const v=sel.options[sel.selectedIndex].dataset.duration;if(!v){p.textContent='⏱ {{t('duration_auto2')|e}}';return}const [a,b]=v.split('|');let m=Math.max(0,Math.round((new Date(b.replace(' ','T')+'Z')-new Date(a.replace(' ','T')+'Z'))/60000)),d=Math.floor(m/1440);m%=1440;let h=Math.floor(m/60);m%=60;let o=[];if(d)o.push(d+' day'+(d==1?'':'s'));if(h)o.push(h+' hour'+(h==1?'':'s'));if(m||!o.length)o.push(m+' min');p.textContent='⏱ {{t('time_taken2')|e}}: '+o.join(' ')}sel.addEventListener('change',duration);duration();</script>{% endblock %}
